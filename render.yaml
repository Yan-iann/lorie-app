# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the Laravel app as a Docker web service on Render's free plan.
# The database lives on Neon (free Postgres). Values marked `sync: false`
# are secrets: Render will prompt you for them (or set them in the dashboard).
#
# Note: Render injects its own $PORT at runtime; the container's entrypoint
# binds Nginx to it automatically, so no PORT variable is needed here.

services:
  - type: web
    name: lorie-app
    runtime: docker
    plan: free
    # Must match the Neon database's region (AWS Singapore) — every page makes
    # several database round trips. Can't be changed after the service exists.
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      # ── Core Laravel ──────────────────────────────────────────
      - key: APP_NAME
        value: CalorieTracker
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY            # generate locally: php artisan key:generate --show
        sync: false
      - key: APP_URL            # e.g. https://lorie-app.onrender.com
        sync: false
      - key: APP_TIMEZONE       # decides when "today" rolls over and the greeting
        value: Asia/Manila
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      # ── Database (Neon Postgres — paste from your Neon dashboard) ──
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      # ── Sessions / cache / queue all use the database ──────────
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local

      # ── Google sign-in (OAuth client from Google Cloud console) ──
      # Authorized redirect URI: <APP_URL>/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # ── AI providers: Gemini primary, Groq automatic fallback ──
      - key: AI_PROVIDER
        value: gemini
      - key: AI_FALLBACK_PROVIDER
        value: groq
      - key: AI_FALLBACK_COOLDOWN_MINUTES
        value: "30"
      # Gemini (primary) — multimodal, handles both text and photos
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      # Groq (fallback when Gemini is rate-limited)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: USDA_API_KEY
        sync: false
