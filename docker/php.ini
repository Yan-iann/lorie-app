; Production PHP settings for the container

memory_limit = 256M
max_execution_time = 60

; Food photos from phones can be large
upload_max_filesize = 20M
post_max_size = 21M

; Opcache — code never changes without a redeploy, so timestamps aren't validated
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
